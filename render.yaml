services:
  - type: web
    name: mudiang-gis
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    disk:
      name: mudiang-gis-storage
      mountPath: /var/www/html/storage
      sizeGB: 1
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_NAME
        value: barangay_gis
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
